services:
  mongodb:
    image: mongo:7.0
    container_name: bugboard_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bugboard
    volumes:
      - mongo_data:/data/db

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: bugboard_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: bugboard_minio
    restart: unless-stopped
    ports:
      - "9000:9000" # MinIO S3 API
      - "9001:9001" # MinIO Web Console
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-miniopassword}
    volumes:
      - minio_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bugboard_server
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      API_VERSION: ${API_VERSION:-v1}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/bugboard}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_key_change_in_production_min_32_chars!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_TOKEN: ${JWT_TOKEN:-}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@bugboard.test}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-miniopassword}
      S3_BUCKET: ${S3_BUCKET:-bugboard-attachments}
      ADMIN_NAME: ${ADMIN_NAME:-Admin User}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bugboard.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Password123!}
      ADMIN_EMPLOYEE_ID: ${ADMIN_EMPLOYEE_ID:-ADM-0001}
      ADMIN_DEPARTMENT: ${ADMIN_DEPARTMENT:-Platform Operations}
    depends_on:
      - mongodb
      - mailpit
      - minio

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
    container_name: bugboard_client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
    name: bugboard_mongo_data
  minio_data:
    name: bugboard_minio_data
